name: Build

# Builds the Dockerfile, which installs the dependencies and compiles every program. It does not run them: that needs a
# RealSense camera.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The cache keeps the dependencies layer (librealsense takes a while to build), so most runs only compile the code
      - name: Build the dependencies and compile all the programs
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
